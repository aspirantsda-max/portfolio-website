
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CENSS | Analytics Workspace</title>

<style>
:root {
    --bg: #080d1b;
    --panel: #111a2e;
    --panel2: #17233b;
    --border: #293852;
    --text: #f1f5f9;
    --muted: #9aabc4;
    --blue: #60a5fa;
    --purple: #a78bfa;
    --green: #34d399;
    --red: #fb7185;
}
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at top right,#18264a 0%,var(--bg) 55%);
    min-height: 100vh;
}
button,input,select { font: inherit; }
button { cursor: pointer; }
button:focus-visible,input:focus-visible,select:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 2px;
}
button:disabled { opacity: .5; cursor: not-allowed; }

/* LOGIN */
#loginPage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.login-card {
    width: 390px;
    max-width: 100%;
    padding: 36px;
    border: 1px solid #344563;
    border-radius: 22px;
    background: rgba(17,26,46,.95);
    box-shadow: 0 25px 80px #0007;
}
.logo {
    width: 65px;
    height: 65px;
    display: grid;
    place-items: center;
    margin: 0 auto 15px;
    border-radius: 20px;
    font-size: 29px;
    background: linear-gradient(135deg,#2563eb,#8b5cf6);
}
.login-card h2 { text-align: center; margin: 8px 0; }
.login-card > p { text-align: center; color: var(--muted); }
.login-card input {
    width: 100%;
    margin-top: 14px;
    padding: 13px;
    background: #0b1325;
    color: white;
    border: 1px solid var(--border);
    border-radius: 9px;
}
.primary-btn {
    color: white;
    background: linear-gradient(100deg,#2563eb,#7c3aed);
    border: 0;
    border-radius: 9px;
    padding: 12px 16px;
    font-weight: 600;
}
.login-card .primary-btn { width: 100%; margin-top: 18px; }
.recovery {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 18px;
}
a { color: #93c5fd; cursor: pointer; font-size: 13px; }
#error { color: #fda4af; font-size: 13px; }

/* APPLICATION LAYOUT */
#dashboard { display: none; }
.sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: 260px;
    overflow-y: auto;
    padding: 22px 15px;
    background: rgba(12,19,35,.97);
    border-right: 1px solid var(--border);
    z-index: 5;
}
.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 5px 8px 25px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 22px;
}
.brand-icon {
    display: grid;
    place-items: center;
    width: 43px;
    height: 43px;
    background: linear-gradient(135deg,#2563eb,#8b5cf6);
    border-radius: 13px;
    font-size: 22px;
}
.brand strong { font-size: 21px; letter-spacing: 1px; }
.brand small { display: block; color: var(--muted); margin-top: 3px; }
.nav-label {
    padding: 0 10px 9px;
    font-size: 11px;
    color: #7185a4;
    letter-spacing: 1.5px;
    font-weight: 700;
}
.nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 12px;
    margin: 5px 0;
    color: #dce6f6;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 10px;
    text-align: left;
    transition: .2s;
}
.nav-item:hover { background: #17233b; }
.nav-item.selected {
    background: linear-gradient(100deg,#1d3d70,#27234f);
    border-color: #3e5681;
    color: white;
}
.nav-left { display: flex; align-items: center; gap: 11px; }
.arrow { color: var(--muted); transition: transform .2s; }
.nav-item[aria-expanded="true"] .arrow { transform: rotate(90deg); }
.sub-list {
    display: none;
    margin: 3px 0 9px 16px;
    padding-left: 12px;
    border-left: 1px solid #344563;
}
.sub-item {
    width: 100%;
    text-align: left;
    padding: 10px;
    color: #aebdd3;
    background: transparent;
    border: 0;
    border-radius: 8px;
    margin: 2px 0;
}
.sub-item:hover,.sub-item.active {
    color: white;
    background: #203656;
}
.bot-nav { margin-top: 17px; border-top: 1px solid var(--border); padding-top: 18px; }

.main {
    margin-left: 260px;
    min-height: 100vh;
    padding: 25px 30px;
}
.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
}
.page-caption { color: var(--muted); font-size: 13px; }
.toolbar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 9px;
}
.toolbar input[type="search"],.toolbar select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: white;
    padding: 10px 12px;
    border-radius: 9px;
    max-width: 220px;
}
.action-btn {
    border: 1px solid var(--border);
    border-radius: 9px;
    color: white;
    background: var(--panel2);
    padding: 10px 13px;
}
.action-btn:hover { filter: brightness(1.2); }
.upload-btn { background: #145c47; border-color: #287d63; }
.logout-btn { background: #47212b; border-color: #713342; }
.file-btn {
    display: inline-block;
    background: #243b65;
    border: 1px solid #3d5787;
    border-radius: 9px;
    padding: 10px 13px;
    cursor: pointer;
}
.file-btn input { display: none; }

.workspace { padding-top: 25px; }
.section-heading {
    font-size: 20px;
    margin: 0 0 8px;
}
.muted { color: var(--muted); font-size: 13px; line-height: 1.6; }
.folder-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(210px,1fr));
    gap: 15px;
    margin-top: 22px;
}
.folder-card {
    padding: 20px;
    border: 1px solid var(--border);
    background: linear-gradient(145deg,#17243c,#10192c);
    border-radius: 15px;
    cursor: pointer;
    transition: transform .2s,border-color .2s;
}
.folder-card:hover {
    transform: translateY(-3px);
    border-color: #648bd0;
}
.folder-icon {
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    font-size: 23px;
    border-radius: 13px;
    background: #253b60;
    margin-bottom: 15px;
}
.folder-card strong { display: block; font-size: 16px; }
.folder-card small { color: var(--muted); display: block; margin-top: 8px; }

.content-panel {
    margin-top: 20px;
    padding: 20px;
    background: rgba(17,26,46,.8);
    border: 1px solid var(--border);
    border-radius: 15px;
}
.file-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px;
    margin-top: 9px;
    border-radius: 10px;
    background: #18243a;
    border: 1px solid #293852;
}
.file-name {
    min-width: 0;
    overflow-wrap: anywhere;
    color: #dceaff;
    cursor: pointer;
}
.file-name:hover { color: var(--blue); }
.file-actions { display: flex; gap: 7px; flex-shrink: 0; }
.delete-btn { background: #522631; border-color: #753b48; }
.back-btn { margin-top: 17px; }
#viewer {
    display: none;
    margin-top: 20px;
    padding: 16px;
    background: #111a2e;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: auto;
}
#viewer img { max-width: 100%; max-height: 700px; display: block; }
#viewer iframe { width: 100%; height: 600px; border: 0; background: white; }
.empty {
    text-align: center;
    padding: 45px 20px;
    border: 1px dashed #344563;
    border-radius: 13px;
    color: var(--muted);
}
#botPanel { display: none; }
#chatMessages {
    height: 340px;
    overflow-y: auto;
    padding: 15px;
    margin: 16px 0;
    border-radius: 12px;
    background: #080f1f;
    border: 1px solid var(--border);
}
.message { margin: 12px 0; line-height: 1.6; overflow-wrap: anywhere; }
.bot-message { color: #93c5fd; }
.user-message { color: #86efac; }
.chat-form { display: flex; gap: 10px; }
.chat-form input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border: 1px solid var(--border);
    background: #0b1325;
    color: white;
    border-radius: 9px;
}
.notice { color: #fbbf24; font-size: 12px; margin-top: 15px; }

@media(max-width:900px) {
    .sidebar { width: 225px; }
    .main { margin-left: 225px; padding: 20px; }
    .topbar { align-items: flex-start; flex-direction: column; }
    .toolbar { width: 100%; }
}
@media(max-width:650px) {
    .sidebar {
        position: relative;
        width: 100%;
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--border);
    }
    .main { margin-left: 0; padding: 16px; }
    .toolbar input[type="search"] { flex: 1; max-width: none; }
    .folder-grid { grid-template-columns: 1fr; }
    .file-row { align-items: flex-start; }
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginPage">
    <div class="login-card">
        <div class="logo">📊</div>
        <h2>CENSS Workspace</h2>
        <p>Sign in to manage your analytics files</p>

        <form id="loginForm">
            <input id="username" placeholder="Username"
                   autocomplete="username" required>
            <input id="password" type="password" placeholder="Password"
                   autocomplete="current-password" required>
            <button class="primary-btn" type="submit">Sign In →</button>
        </form>

        <div class="recovery">
            <a href="#" id="forgotId">Forgot ID?</a>
            <a href="#" id="forgotPassword">Forgot Password?</a>
        </div>
        <p id="error" role="status"></p>
    </div>
</section>

<!-- DASHBOARD -->
<div id="dashboard">

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">📊</div>
            <div><strong>CENSS</strong><small>Analytics Workspace</small></div>
        </div>

        <div class="nav-label">WORKSPACE</div>
        <nav id="navigation"></nav>

        <div class="bot-nav">
            <button class="nav-item" id="botNav">
                <span class="nav-left"><span>🤖</span> What's Bot</span>
            </button>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <div>
                <div class="page-caption">YOUR WORKSPACE</div>
            </div>

            <div class="toolbar">
                <input type="search" id="searchInput" placeholder="🔍 Search files">
                <select id="sortType" aria-label="Sort files">
                    <option value="az">Name: A–Z</option>
                    <option value="za">Name: Z–A</option>
                    <option value="new">Newest first</option>
                    <option value="old">Oldest first</option>
                </select>

                <label class="file-btn">
                    + Choose File
                    <input type="file" id="fileInput">
                </label>
                <button class="action-btn upload-btn" id="uploadBtn">Upload</button>
                <button class="action-btn logout-btn" id="logoutBtn">Logout ↗</button>
            </div>
        </header>

        <section class="workspace" id="workspace">
            <div id="content"></div>
            <div id="viewer"></div>
        </section>

        <section id="botPanel">
            <div class="content-panel">
                <h2 class="section-heading">🤖 What's Bot</h2>
                <p class="muted">Your CENSS dashboard assistant.</p>
                <div id="chatMessages" aria-live="polite">
                    <div class="message bot-message">
                        Bot: Hello! I can help you understand folders, uploading,
                        searching, sorting, previews, and deleting files.
                    </div>
                </div>
                <form class="chat-form" id="chatForm">
                    <input id="chatInput" placeholder="Ask a question..." required>
                    <button class="primary-btn" type="submit">Send</button>
                </form>
                <button class="action-btn back-btn" id="backToWorkspace">← Back to Workspace</button>
            </div>
        </section>
    </main>
</div>

<script>
"use strict";

// DEMO LOGIN. Use a secure backend for production.
const USERS = { censs: "censs@1234" };
const MEMBERS = ["Chandana", "Eswari", "Narendra", "Sandhya", "Saathvik"];

const FOLDERS = {
    "Power BI": MEMBERS,
    "Excel": MEMBERS,
    "SQL": MEMBERS,
    "Python": MEMBERS,
    "Tableau": MEMBERS,
    "Data Sets": ["Raw Dataset", "Cleaned Dataset"]
};

const $ = id => document.getElementById(id);

let currentFolder = "";
let currentSub = "";
let expandedFolder = "";
let storage = {};

try {
    storage = JSON.parse(localStorage.getItem("censs_storage")) || {};
} catch (error) {
    storage = {};
}

function getFiles(folder, sub) {
    return storage[folder]?.[sub] || [];
}

function saveStorage() {
    try {
        localStorage.setItem("censs_storage", JSON.stringify(storage));
        return true;
    } catch (error) {
        alert("Browser storage is full. Delete some files or use server-side storage.");
        return false;
    }
}

// LOGIN
$("loginForm").addEventListener("submit", event => {
    event.preventDefault();

    const user = $("username").value.trim();
    const pass = $("password").value;

    if (USERS[user] === pass) {
        $("loginPage").style.display = "none";
        $("dashboard").style.display = "block";
        $("error").textContent = "";
        renderNavigation();
        showHome();
    } else {
        $("error").textContent = "Incorrect username or password.";
    }
});

$("forgotId").addEventListener("click", event => {
    event.preventDefault();
    alert("Demo username: censs\nFor a deployed system, contact your administrator.");
});

$("forgotPassword").addEventListener("click", event => {
    event.preventDefault();
    alert("Password recovery is not configured in this demo. Contact your administrator to reset the password.");
});

$("logoutBtn").addEventListener("click", () => {
    $("password").value = "";
    $("dashboard").style.display = "none";
    $("loginPage").style.display = "flex";
});

// SIDEBAR: MAIN FOLDERS START COLLAPSED
function renderNavigation() {
    const nav = $("navigation");
    nav.innerHTML = "";

    Object.entries(FOLDERS).forEach(([folder, subfolders]) => {
        const wrapper = document.createElement("div");

        const mainButton = document.createElement("button");
        mainButton.className = "nav-item";
        mainButton.dataset.folder = folder;
        mainButton.setAttribute("aria-expanded", String(expandedFolder === folder));

        const left = document.createElement("span");
        left.className = "nav-left";

        const icon = document.createElement("span");
        icon.textContent = ({
            "Power BI": "📈",
            "Excel": "📊",
            "SQL": "🗄️",
            "Python": "🐍",
            "Tableau": "📉",
            "Data Sets": "📁"
        })[folder];

        const label = document.createElement("span");
        label.textContent = folder;

        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = "›";

        left.append(icon, label);
        mainButton.append(left, arrow);

        if (currentFolder === folder) mainButton.classList.add("selected");

        mainButton.addEventListener("click", () => {
            expandedFolder = expandedFolder === folder ? "" : folder;
            currentFolder = folder;
            currentSub = "";
            renderNavigation();

            if (expandedFolder === folder) {
                showSubfolders(folder);
            } else {
                showHome();
            }
        });

        const subList = document.createElement("div");
        subList.className = "sub-list";
        subList.style.display = expandedFolder === folder ? "block" : "none";

        subfolders.forEach(sub => {
            const subButton = document.createElement("button");
            subButton.className = "sub-item";
            subButton.textContent = "└  " + sub;

            if (currentFolder === folder && currentSub === sub) {
                subButton.classList.add("active");
            }

            subButton.addEventListener("click", () => {
                currentFolder = folder;
                currentSub = sub;
                expandedFolder = folder;
                renderNavigation();
                showFiles();
            });

            subList.appendChild(subButton);
        });

        wrapper.append(mainButton, subList);
        nav.appendChild(wrapper);
    });
}

// INITIAL VIEW: NO FOLDER CARDS OR SUBFOLDERS
function showHome() {
    currentSub = "";
    $("botPanel").style.display = "none";
    $("workspace").style.display = "block";
    $("viewer").style.display = "none";
    $("content").innerHTML = `
        <div class="empty">
            <div style="font-size:36px;margin-bottom:12px">✦</div>
            <strong style="color:#e2e8f0">Select a folder to get started</strong>
            <p class="muted">Choose a workspace folder from the sidebar.</p>
        </div>`;
    $("searchInput").value = "";
    $("fileInput").value = "";
    updateToolbar();
}

// MAIN FOLDER CLICKED: SHOW ITS SUBFOLDERS
function showSubfolders(folder) {
    currentFolder = folder;
    currentSub = "";
    $("botPanel").style.display = "none";
    $("workspace").style.display = "block";
    $("viewer").style.display = "none";
    $("searchInput").value = "";
    $("content").innerHTML = "";

    const heading = document.createElement("h2");
    heading.className = "section-heading";
    heading.textContent = folder;

    const description = document.createElement("p");
    description.className = "muted";
    description.textContent = "Select a subfolder to manage its files.";

    const grid = document.createElement("div");
    grid.className = "folder-grid";

    FOLDERS[folder].forEach(sub => {
        const files = getFiles(folder, sub);
        const card = document.createElement("div");
        card.className = "folder-card";

        const icon = document.createElement("div");
        icon.className = "folder-icon";
        icon.textContent = folder === "Data Sets" ? "🗂️" : "📂";

        const name = document.createElement("strong");
        name.textContent = sub;

        const count = document.createElement("small");
        count.textContent = files.length + (files.length === 1 ? " file" : " files");

        card.append(icon, name, count);
        card.addEventListener("click", () => {
            currentSub = sub;
            renderNavigation();
            showFiles();
        });

        grid.appendChild(card);
    });

    $("content").append(heading, description, grid);
    updateToolbar();
}

// SEARCH AND SORT FILES
$("searchInput").addEventListener("input", showFilesIfSelected);
$("sortType").addEventListener("change", showFilesIfSelected);

function showFilesIfSelected() {
    if (currentFolder && currentSub) showFiles();
}

function showFiles() {
    if (!currentFolder || !currentSub) return;

    $("botPanel").style.display = "none";
    $("workspace").style.display = "block";
    $("viewer").style.display = "none";
    $("viewer").innerHTML = "";

    const search = $("searchInput").value.trim().toLowerCase();
    const sort = $("sortType").value;

    const files = getFiles(currentFolder, currentSub)
        .map((file, index) => ({ ...file, originalIndex: index }))
        .filter(file => file.name.toLowerCase().includes(search));

    files.sort((a, b) => {
        if (sort === "az") return a.name.localeCompare(b.name);
        if (sort === "za") return b.name.localeCompare(a.name);
        if (sort === "new") return (b.uploadedAt || 0) - (a.uploadedAt || 0);
        if (sort === "old") return (a.uploadedAt || 0) - (b.uploadedAt || 0);
        return 0;
    });

    const content = $("content");
    content.innerHTML = "";

    const heading = document.createElement("h2");
    heading.className = "section-heading";
    heading.textContent = currentFolder + " / " + currentSub;

    const description = document.createElement("p");
    description.className = "muted";
    description.textContent = files.length + (files.length === 1 ? " file" : " files");

    content.append(heading, description);

    if (files.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = search ? "No matching files found." : "This folder is empty. Choose a file above and click Upload.";
        content.appendChild(empty);
    }

    files.forEach(file => {
        const row = document.createElement("div");
        row.className = "file-row";

        const name = document.createElement("span");
        name.className = "file-name";
        name.textContent = "📄  " + file.name;
        name.title = "Click to preview or download";
        name.addEventListener("click", () => openFile(file.originalIndex));

        const actions = document.createElement("div");
        actions.className = "file-actions";

        const openButton = document.createElement("button");
        openButton.className = "action-btn";
        openButton.textContent = "Open";
        openButton.addEventListener("click", () => openFile(file.originalIndex));

        const deleteButton = document.createElement("button");
        deleteButton.className = "action-btn delete-btn";
        deleteButton.textContent = "Delete";
        deleteButton.addEventListener("click", () => deleteFile(file.originalIndex));

        actions.append(openButton, deleteButton);
        row.append(name, actions);
        content.appendChild(row);
    });

    const back = document.createElement("button");
    back.className = "action-btn back-btn";
    back.textContent = "← Back to " + currentFolder;
    back.addEventListener("click", () => {
        currentSub = "";
        renderNavigation();
        showSubfolders(currentFolder);
    });

    content.appendChild(back);
    updateToolbar();
}

function updateToolbar() {
    const active = Boolean(currentFolder && currentSub);
    $("uploadBtn").disabled = !active;
    $("fileInput").disabled = !active;
    $("searchInput").disabled = !active;
    $("sortType").disabled = !active;
}

// UPLOAD
$("uploadBtn").addEventListener("click", () => {
    const file = $("fileInput").files[0];

    if (!currentFolder || !currentSub) {
        alert("Open a main folder and select a subfolder first.");
        return;
    }

    if (!file) {
        alert("Choose a file before clicking Upload.");
        return;
    }

    // localStorage is limited; this demo accepts files up to 2 MB.
    if (file.size > 2 * 1024 * 1024) {
        alert("This browser demo supports files up to 2 MB. Use server storage for larger files.");
        return;
    }

    const reader = new FileReader();

    reader.onload = event => {
        if (!storage[currentFolder]) storage[currentFolder] = {};
        if (!storage[currentFolder][currentSub]) storage[currentFolder][currentSub] = [];

        storage[currentFolder][currentSub].push({
            name: file.name,
            data: event.target.result,
            type: file.type || "application/octet-stream",
            uploadedAt: Date.now()
        });

        if (saveStorage()) {
            $("fileInput").value = "";
            renderNavigation();
            showFiles();
        }
    };

    reader.onerror = () => alert("The selected file could not be read.");
    reader.readAsDataURL(file);
});

// DELETE
function deleteFile(index) {
    const files = getFiles(currentFolder, currentSub);
    if (!files[index]) return;

    if (!confirm('Delete "' + files[index].name + '"?')) return;

    const removed = files.splice(index, 1)[0];

    if (!saveStorage()) {
        files.splice(index, 0, removed);
        return;
    }

    $("viewer").innerHTML = "";
    $("viewer").style.display = "none";
    renderNavigation();
    showFiles();
}

// PREVIEW / DOWNLOAD
function openFile(index) {
    const file = getFiles(currentFolder, currentSub)[index];
    if (!file) return;

    const viewer = $("viewer");
    viewer.innerHTML = "";
    viewer.style.display = "block";

    const title = document.createElement("h3");
    title.textContent = file.name;

    const close = document.createElement("button");
    close.className = "action-btn";
    close.textContent = "Close Preview";
    close.addEventListener("click", () => {
        viewer.style.display = "none";
        viewer.innerHTML = "";
    });

    viewer.append(title, close);

    if (file.type.startsWith("image/")) {
        const image = document.createElement("img");
        image.src = file.data;
        image.alt = file.name;
        viewer.appendChild(image);
    } else if (file.type === "application/pdf") {
        const frame = document.createElement("iframe");
        frame.src = file.data;
        frame.title = file.name;
        viewer.appendChild(frame);
    } else if (file.type.startsWith("text/") && file.data.startsWith("data:")) {
        const link = document.createElement("a");
        link.href = file.data;
        link.download = file.name;
        link.textContent = "Download " + file.name;
        link.style.display = "block";
        link.style.marginTop = "15px";
        link.style.color = "#93c5fd";
        viewer.appendChild(link);
    } else {
        const link = document.createElement("a");
        link.href = file.data;
        link.download = file.name;
        link.textContent = "Download " + file.name;
        link.style.display = "block";
        link.style.marginTop = "15px";
        link.style.color = "#93c5fd";
        viewer.appendChild(link);
        const note = document.createElement("p");
        note.className = "muted";
        note.textContent = "Preview is unavailable for this file type. Download it to open it with a suitable application.";
        viewer.appendChild(note);
    }

    viewer.scrollIntoView({ behavior: "smooth", block: "start" });
}

// WHAT'S BOT: LOCAL FAQ ASSISTANT, NOT AN AI API
$("botNav").addEventListener("click", () => {
    $("workspace").style.display = "none";
    $("botPanel").style.display = "block";
    $("searchInput").value = "";
    $("viewer").style.display = "none";
    $("chatInput").focus();
});

$("backToWorkspace").addEventListener("click", () => {
    $("botPanel").style.display = "none";
    $("workspace").style.display = "block";
});

$("chatForm").addEventListener("submit", event => {
    event.preventDefault();

    const input = $("chatInput");
    const question = input.value.trim();
    if (!question) return;

    addMessage("You: " + question, "user-message");
    input.value = "";

    const q = question.toLowerCase();
    let answer;

    if (/hello|^hi\b|hey/.test(q)) {
        answer = "Hello! I can help you use the CENSS workspace.";
    } else if (q.includes("upload")) {
        answer = "Open a main folder, select a subfolder, choose a file, and click Upload. This demo supports files up to 2 MB.";
    } else if (q.includes("search")) {
        answer = "Select a subfolder first, then enter part of the filename in the search box.";
    } else if (q.includes("sort") || q.includes("newest") || q.includes("oldest")) {
        answer = "Use the sorting menu to arrange files alphabetically or by upload date.";
    } else if (q.includes("delete")) {
        answer = "Click Delete beside a file and confirm. The deletion is saved in this browser.";
    } else if (q.includes("folder")) {
        answer = "Click a main folder in the sidebar to expand its subfolders. Select a subfolder to see its files.";
    } else if (q.includes("password") || q.includes("login") || q.includes("username")) {
        answer = "This demo login uses username censs. Password recovery and account management need a secure server-side system.";
    } else if (q.includes("pdf") || q.includes("preview") || q.includes("open")) {
        answer = "Click Open beside a file. Images and PDFs can be previewed; other file types can be downloaded.";
    } else {
        answer = "I can answer questions about folders, uploading, searching, sorting, deleting, and file previews. This is a local FAQ bot, not a connected AI service.";
    }

    addMessage("Bot: " + answer, "bot-message");
});

function addMessage(message, className) {
    const div = document.createElement("div");
    div.className = "message " + className;
    div.textContent = message;
    $("chatMessages").appendChild(div);
    $("chatMessages").scrollTop = $("chatMessages").scrollHeight;
}
</script>
